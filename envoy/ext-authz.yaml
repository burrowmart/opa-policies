# Envoy ext_authz gRPC filter — reference snippet
#
# Purpose: every service pod's Envoy PEP sidecar delegates authorization to the
# OPA PDP DaemonSet running on the same node.  failure_mode_allow is false so a
# PDP crash results in deny, not open access.
#
# Usage: merge the `http_filters` entry into your service's Envoy bootstrap
# ConfigMap (generated by the base Helm chart in platform-infra/helm/base-service).
# The `opa_pdp` cluster stanza belongs in `static_resources.clusters`.
#
# OPA PDP DaemonSet address: the base Helm chart injects the node's hostIP via
# the Downward API as HOST_IP; the cluster below uses that env-var substitution.
# If you run OPA as a sidecar instead of a DaemonSet, replace the address with
# 127.0.0.1.

static_resources:
  clusters:
    - name: opa_pdp
      connect_timeout: 0.25s
      type: STATIC
      # h2 required — OPA's ext_authz endpoint speaks gRPC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: opa_pdp
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      # HOST_IP is injected by the Helm chart via the Downward API:
                      #   env:
                      #     - name: HOST_IP
                      #       valueFrom:
                      #         fieldRef:
                      #           fieldPath: status.hostIP
                      address: "%HOST_IP%"
                      port_value: 9191

http_filters:
  - name: envoy.filters.http.ext_authz
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
      transport_api_version: V3
      # A PDP failure causes DENY — never open-fail.
      failure_mode_allow: false
      grpc_service:
        envoy_grpc:
          cluster_name: opa_pdp
        timeout: 0.5s
      # Forward the original HTTP method, path, and headers to OPA so Rego can
      # inspect them alongside the injected subject attributes.
      with_request_body:
        max_request_bytes: 8192
        allow_partial_message: true
      # OPA returns x-ext-authz-* response headers; propagate them downstream
      # so NestJS services can read the resolved principal without re-decoding.
      allowed_headers:
        patterns:
          - exact: x-ext-authz-check-result
          - exact: x-ext-authz-additional-headers-to-log
